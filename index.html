<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 06 - JavaScript</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 30px;
      color: #333;
    }

    h1 {
      font-family: 'Times New Roman', Times, serif;
      font-size: 2.8rem;
      margin-bottom: 10px;
    }

    h2 {
      font-family: 'Times New Roman', Times, serif;
      font-size: 2rem;
      margin-bottom: 25px;
    }

    .vote-container {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 30px;
    }

    .vote-btn {
      background-color: #eef0f3;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 10px 25px;
      font-size: 2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: background-color 0.2s, transform 0.1s;
    }

    .vote-btn:hover {
      background-color: #e0e3e8;
    }

    .vote-btn:active {
      transform: scale(0.98);
    }

    .vote-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .comment-section {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }

    textarea {
      width: 100%;
      height: 120px;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 10px;
      font-family: inherit;
      font-size: 1rem;
      resize: vertical;
      box-sizing: border-box;
    }

    .action-buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 15px;
    }

    .action-btn {
      background-color: #555;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 10px 25px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .action-btn:hover {
      background-color: #333;
    }

    .action-btn:disabled {
      background-color: #aaa;
      cursor: not-allowed;
    }

    #commentsDisplay {
      margin-top: 25px;
      text-align: left;
      border-top: 1px solid #ddd;
      padding-top: 15px;
    }

    .comment-item {
      background: #f9f9f9;
      border-left: 4px solid #555;
      padding: 8px 12px;
      margin-bottom: 8px;
      border-radius: 0 4px 4px 0;
      word-wrap: break-word;
    }

    .status-msg {
      margin-top: 10px;
      color: #666;
      font-style: italic;
    }
  </style>
</head>
<body>

  <h1>Lab 6</h1>
  <h2>Like or dislike</h2>

  <!-- Vote Buttons -->
  <div class="vote-container">
    <button class="vote-btn" id="likeBtn">
      <span>👍</span><span id="likeCount">100</span>
    </button>
    <button class="vote-btn" id="dislikeBtn">
      <span>👎</span><span id="dislikeCount">20</span>
    </button>
  </div>

  <!-- Comments Section -->
  <div class="comment-section">
    <h2>Comments</h2>
    <textarea id="commentInput" placeholder="Write a comment..."></textarea>
    
    <div class="action-buttons">
      <button class="action-btn" id="submitBtn">Submit</button>
      <button class="action-btn" id="clearBtn">Clear</button>
    </div>

    <div id="statusMsg" class="status-msg"></div>
    <div id="commentsDisplay"></div>
  </div>

  <script src="index.js"></script>
</body>
</html>
